# All checks that need nothing of a console: the host tests (test/*/run.sh, built with gcc/clang and the sanitizers),
# the fan simulation, a syntax check of the web scripts and a load check of the JSON files (languages, manual/FAQ sources).
# Left out on purpose: test/lz4cross (needs the directory of a second LZ4 version as argument).
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# The tests only read the repository (audit 16.11.2026): no write rights for the token, and the actions are pinned to a commit.
permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests and simulation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Tools (gcc, clang, python3, ntfs-3g and sfdisk for test/ntfsfm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc clang python3 ntfs-3g fdisk
      - name: Host tests
        run: |
          # every test runs even when an earlier one failed; the step fails at the end if any did
          failed=""
          for t in account bgpause chives configserial coolsuggest cvname cvpack cvsample convpfs dfcheck drivegate driveholders dumpdir ejectmark filemgr fpkgdup fpkgprogress fsign fwimports imgwalk indexlimit instlock jobreg krakenboot krakenmig ntfsfm origafter paystore pngcheck probefail progressnote ps4m savebackup savedb saveimport savesfo savexport savezip sha256 smpcfg smphold smpunreg tvname ufs2plan unpackfb usbeject vercmp zstdpack; do
            echo "::group::test/$t"
            if sh "test/$t/run.sh"; then echo "ok: $t"; else echo "::error::test/$t failed"; failed="$failed $t"; fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then echo "Failed:$failed"; exit 1; fi
      - name: Fan simulation (test/sim)
        run: sh test/sim/run.sh

  web-and-data:
    name: Web scripts and JSON files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: node --check web/*.js
        run: |
          for f in web/*.js; do
            echo "check $f"
            node --check "$f"
          done
      - name: Load JSON files (docs_src.*.json, web/lang/*.json)
        run: |
          python3 - <<'PY'
          import glob, json, sys
          files = sorted(glob.glob("tools/i18n/docs/docs_src.*.json") + glob.glob("web/lang/*.json"))
          if not files:
              sys.exit("no JSON files found")
          bad = 0
          for f in files:
              try:
                  with open(f, encoding="utf-8") as fh:
                      json.load(fh)
                  print("ok", f)
              except Exception as e:
                  bad += 1
                  print("::error file=%s::%s" % (f, e))
          sys.exit(1 if bad else 0)
          PY
