changelog:
  categories:
    - title: New Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Performance
      labels:
        - performance
        - optimization
    - title: Documentation
      labels:
        - docs
        - documentation
    - title: Maintenance
      labels:
        - chore
        - refactor
        - dependencies
  exclude:
    labels:
      - skip-changelog
      - invalid
      - wontfix
      - duplicate
    authors:
      - dependabot
